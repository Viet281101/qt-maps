name: Feature request
description: Propose a user-visible QtMaps capability or improvement
title: "feat: "
labels:
  - enhancement
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Describe the user problem without prescribing implementation details.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the user be able to do or understand when this is complete?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Observable outcome one
        - [ ] Observable outcome two
        - [ ] Error or degraded state is handled
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what is included, excluded, or intentionally deferred.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      description: Final priority is set during planning.
      options:
        - P0 — required for the committed demo
        - P1 — after the core demo is stable
        - Unscheduled — needs triage
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, risks, and evidence
      description: Note data, licensing, offline behavior, performance, hardware, or architecture constraints.

  - type: checkboxes
    id: tracking
    attributes:
      label: Tracking checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: The issue will be linked to the correct milestone and Project #6 fields during triage.
          required: true
